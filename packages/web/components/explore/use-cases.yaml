# MindOS Explore — Use Case Definitions (Single Source of Truth)
#
# To add a new use case: just append a new entry below.
# Run `npm run generate` to regenerate use-cases.ts + i18n.
#
# Fields:
#   id:       Unique identifier (e.g. c10)
#   icon:     Emoji fallback when no image is available
#   image:    (optional) Custom image path under /explore/. Omit to use /explore/{id}.png
#   category: One of: knowledge-management | memory-sync | auto-execute | experience-evolution | human-insights | audit-control
#   scenario: One of: first-day | daily | project | advanced
#   zh/en:    Bilingual text — title, desc, prompt

# ── Category & Scenario labels (used by filter UI) ──
meta:
  categories:
    knowledge-management:
      en: Knowledge Management
      zh: 知识管理
    memory-sync:
      en: Memory Sync
      zh: 记忆同步
    auto-execute:
      en: Auto Execute
      zh: 自动执行
    experience-evolution:
      en: Experience Evolution
      zh: 经验进化
    human-insights:
      en: Human Insights
      zh: 人类洞察
    audit-control:
      en: Audit & Control
      zh: 审计纠错
  scenarios:
    first-day:
      en: First Day
      zh: 初次使用
    daily:
      en: Daily Work
      zh: 日常工作
    project:
      en: Project Work
      zh: 项目协作
    advanced:
      en: Advanced
      zh: 高级
  ui:
    title:
      en: Start with a task
      zh: 从一件事开始
    subtitle:
      en: "Choose a task. MindOS opens a draft prompt for you to review before sending."
      zh: "选一件想做的事。MindOS 会打开提问草稿，确认后再发送。"
    tryIt:
      en: Edit prompt
      zh: 编辑提问草稿
    all:
      en: All
      zh: 全部
    byCapability:
      en: By Capability
      zh: 按能力
    byScenario:
      en: By Scenario
      zh: 按场景
    taskListTitle:
      en: Starting points
      zh: 从这里开始
    noMatches:
      en: No tasks match these filters.
      zh: 当前筛选下没有任务。
    clearFilters:
      en: Clear filters
      zh: 清除筛选

# ── Use Cases ──
cases:
  - id: c1
    icon: "\U0001F464"
    category: memory-sync
    scenario: first-day
    en:
      title: Set up your profile
      desc: Draft a profile of your goals, preferences and tools; review what agents may use.
      prompt: Help me write a profile for my agents. Ask about my goals, working style and tools, and what I want to keep private before saving anything.
    zh:
      title: 整理个人资料
      desc: 梳理目标、偏好和常用工具，再决定哪些内容适合给 Agent 使用。
      prompt: 帮我整理给 Agent 使用的个人资料。先问我目标、工作方式和常用工具，以及哪些内容需要保密，保存前让我确认。

  - id: c2
    icon: "\U0001F4E5"
    category: knowledge-management
    scenario: daily
    en:
      title: Save a source
      desc: Capture a useful link or note, then review its summary and location.
      prompt: Help me capture a source in MindOS. Ask for the link or notes, then draft a short summary and suggested location for my review.
    zh:
      title: 收好一份资料
      desc: 收藏链接或笔记，检查摘要和存放位置后再入库。
      prompt: 帮我把一份资料收进 MindOS。先问我要保存的链接或笔记，再拟一段摘要和存放位置，供我检查。

  - id: c3
    icon: "\U0001F504"
    category: memory-sync
    scenario: project
    en:
      title: Hand off a task
      desc: Prepare a concise brief with decisions, relevant files and open questions for another agent.
      prompt: Help me prepare a handoff for another agent. Summarize the goal, decisions, open questions and relevant files, then ask me to confirm the brief.
    zh:
      title: 交接一项任务
      desc: 把目标、已做决定、相关文件和未解问题整理成可核对的交接摘要。
      prompt: 帮我准备给另一个 Agent 的任务交接。整理目标、已做决定、未解问题和相关文件，并让我确认摘要。

  - id: c4
    icon: "\U0001F501"
    category: experience-evolution
    scenario: daily
    en:
      title: Keep a working method
      desc: Turn a useful debugging experience into a method you can revisit and revise.
      prompt: Help me turn a recent debugging session into a reusable method. Ask what happened, which steps worked and what remains uncertain.
    zh:
      title: 留下一套做法
      desc: 把有效的排错经验写成以后能回看、能修订的方法。
      prompt: 帮我把最近一次排错经历整理成可复用的方法。先问我发生了什么、哪些步骤有效、哪些地方还不确定。

  - id: c5
    icon: "\U0001F4A1"
    category: auto-execute
    scenario: daily
    en:
      title: Capture an idea
      desc: Keep a thought now, then decide whether it belongs in a note or a task.
      prompt: Help me capture an idea. Ask what sparked it and what I might do next, then let me choose whether to save a note or a task.
    zh:
      title: 记下一个想法
      desc: 先留住想法，再决定是存成笔记还是变成待办。
      prompt: 帮我记下一个想法。先问我灵感从哪里来、下一步可能做什么，再让我决定保存为笔记还是待办。

  - id: c6
    icon: "\U0001F680"
    category: auto-execute
    scenario: project
    en:
      title: Start a project
      desc: Frame the outcome and constraints, then choose a sensible first step.
      prompt: Help me plan a new project. Ask for the outcome, constraints and relevant MindOS notes before proposing first steps.
    zh:
      title: 启动一个项目
      desc: 先明确目标和约束，再决定第一步怎么做。
      prompt: 帮我规划一个新项目。先问我目标、约束和相关的 MindOS 笔记，再建议起步步骤。

  - id: c7
    icon: "\U0001F50D"
    category: knowledge-management
    scenario: project
    en:
      title: Research a question
      desc: Define a question and sources, then collect findings in a reviewable note.
      prompt: Help me research a question. Ask for its scope and available sources, then propose a plan and a place to record findings.
    zh:
      title: 调研一个问题
      desc: 明确问题与资料来源，把发现整理成可检查的笔记。
      prompt: 帮我调研一个问题。先问我范围和现有资料，再提出调研计划与记录发现的位置。

  - id: c8
    icon: "\U0001F91D"
    category: human-insights
    scenario: daily
    en:
      title: Track a follow-up
      desc: Remember a conversation and the next action without keeping more personal detail than needed.
      prompt: Help me make a private follow-up note. Ask which details are appropriate to keep and what action I want to remember.
    zh:
      title: 记住一次跟进
      desc: 记下对话与下一步行动，只保留必要的个人信息。
      prompt: 帮我写一份私密的跟进笔记。先问我哪些信息适合保留，以及我想记住什么下一步行动。

  - id: c9
    icon: "\U0001F6E1\uFE0F"
    category: audit-control
    scenario: advanced
    en:
      title: Review agent context
      desc: Inspect stored context and correct entries that no longer reflect you.
      prompt: Help me review my MindOS profile. Show supporting context where available, then ask which entries to keep, change or remove.
    zh:
      title: 检查 Agent 的上下文
      desc: 核对已保存的资料，修正不准确或过时的内容。
      prompt: 帮我检查 MindOS 里的个人资料。能找到依据时请展示依据，再问我哪些内容要保留、修改或删除。
